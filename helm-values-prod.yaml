projectName: sparrowx
environment: prod

serviceName: reporting-api

replicaCount: 1

appPort: 8000
# extraAnnotations:
# extraLabels:

resources:
  size: medium

servicemonitor:
  enabled: true

probePath: /health
livenessProbe:
  enabled: true
readinessProbe:
  enabled: true
startupProbe:
  enabled: true

container:
  env:
    - name: CUSTOMER_API_URL
      value: "http://customer-api:8000"
    - name: TASK_API_URL
      value: "http://task-api:8000"
    - name: BILLING_API_URL
      value: "http://billing-api:8000"
    - name: UPSTREAM_TIMEOUT_SECONDS
      value: "5"